!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aprende Alimentos</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card-container {
      background: white;
      border-radius: 20px;
      padding: 30px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
      position: relative;
    }
    .image-box {
      background-color: #eef2f7;
      border-radius: 15px;
      height: 180px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 80px;
      margin-bottom: 20px;
    }
    .word-en {
      font-size: 28px;
      font-weight: bold;
      color: #1e293b;
      letter-spacing: 1px;
      margin-bottom: 5px;
      text-transform: uppercase;
    }
    .word-es {
      font-size: 16px;
      color: #64748b;
      font-style: italic;
      margin-bottom: 25px;
    }
    .actions {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 15px;
    }
    .btn-icon {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      transition: all 0.2s;
    }
    .btn-icon:hover {
      background: #e2e8f0;
    }
    .btn-icon.listening {
      background: #ef4444;
      color: white;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    .feedback {
      height: 30px;
      font-size: 24px;
      font-weight: bold;
    }
    .feedback.correct {
      color: #22c55e;
    }
    .feedback.incorrect {
      color: #ef4444;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <div class="image-box" id="objectBox">🍎</div>
    <div class="word-en" id="wordLabel">APPLE</div>
    <div class="word-es" id="translationLabel">(Manzana)</div>

    <div class="actions">
      <button class="btn-icon" id="listenBtn">🔊</button>
      <button class="btn-icon" id="speakBtn">🎧</button>
      <button class="btn-icon" id="nextBtn" title="Siguiente">➡️</button>

    </div>

    <div class="feedback" id="feedbackArea"></div>
  </div>

  <script>
    const items = [
      { name: "apple", translation: "Manzana", emoji: "🍎" },
      { name: "pear", translation: "Pera", emoji: "🍐" },
      { name: "banana", translation: "Plátano", emoji: "🍌" },
      { name: "melon", translation: "Melón", emoji: "🍈" },
      { name: "watermelon", translation: "Sandía", emoji: "🍉" },
      { name: "avocado", translation: "Aguacate", emoji: "🥑" },
      { name: "orange", translation: "Naranja", emoji: "🍊" },
      { name: "strawberry", translation: "Fresa", emoji: "🍓" },
      { name: "kiwi", translation: "Kiwi", emoji: "🥝" },
      { name: "cherry", translation: "Cereza", emoji: "🍒" },
      { name: "bread", translation: "Pan", emoji: "🍞" },
      { name: "cheese", translation: "Queso", emoji: "🧀" },
      { name: "milk", translation: "Leche", emoji: "🥛" },
      { name: "coffee", translation: "Café", emoji: "☕" },
      { name: "chocolate", translation: "Chocolate", emoji: "🍫" },
      { name: "chicken", translation: "Pollo", emoji: "🍗" },
      { name: "meat", translation: "Carne", emoji: "🥩" },
      { name: "fish", translation: "Pescado", emoji: "🐟" },
      { name: "grapes", translation: "Uvas", emoji: "🍇" },
      { name: "pumpkin", translation: "Calabaza", emoji: "🎃" },
      { name: "potato", translation: "Papa", emoji: "🥔" },
      { name: "cucumber", translation: "Pepino", emoji: "🥒" },
      { name: "tomato", translation: "Tomate", emoji: "🍅" },
      { name: "carrot", translation: "Zanahoria", emoji: "🥕" },
      { name: "egg", translation: "Huevo", emoji: "🥚" },
      { name: "butter", translation: "Mantequilla", emoji: "🧈" },
      { name: "salt", translation: "Sal", emoji: "🧂" },
      { name: "sugar", translation: "Azúcar", emoji: "🍬" },
      { name: "broccoli", translation: "Brócoli", emoji: "🥦" },
      { name: "tortilla", translation: "Tortilla", emoji: "🌮" },
      { name: "water", translation: "Agua", emoji: "💧" }
    ];

    let currentIdx = -1;
    const objectBox = document.getElementById('objectBox');
    const wordLabel = document.getElementById('wordLabel');
    const translationLabel = document.getElementById('translationLabel');
    const listenBtn = document.getElementById('listenBtn');
    const speakBtn = document.getElementById('speakBtn');
    const speakBtn = document.getElementById('speakBtn'//---------------------------
    const feedbackArea = document.getElementById('feedbackArea');

    function setRandomItem() {
        let newIdx;
        do {
            newIdx = Math.floor(Math.random() * items.length);
        } while (newIdx === currentIdx && items.length > 1);

        currentIdx = newIdx;
        const currentItem = items[currentIdx];

        objectBox.textContent = currentItem.emoji;
        wordLabel.textContent = currentItem.name.toUpperCase();
        translationLabel.textContent = `(${currentItem.translation})`;
    }

    setRandomItem();

    listenBtn.addEventListener('click', () => {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(items[currentIdx].name);
            utterance.lang = 'en-US';
            utterance.rate = 0.8;
            window.speechSynthesis.speak(utterance);
        }
    });
    const speakBtn = document.getElementById('speakBtn'//-----------------

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        speakBtn.addEventListener('click', () => {
            feedbackArea.textContent = "";
            feedbackArea.className = "feedback";
            speakBtn.classList.add('listening');
            recognition.start();
        });

        recognition.onresult = (event) => {
            speakBtn.classList.remove('listening');
            const spokenWord = event.results[0][0].transcript.toLowerCase().trim();
            const targetWord = items[currentIdx].name;

            if (spokenWord.includes(targetWord)) {
                feedbackArea.textContent = "✔";
                feedbackArea.className = "feedback correct";
                
                setTimeout(() => {
                    feedbackArea.textContent = "";
                    setRandomItem();
                }, 1200);
            } else {
                feedbackArea.textContent = "✖";
                feedbackArea.className = "feedback incorrect";
            }
        };

        recognition.onspeechend = () => speakBtn.classList.remove('listening');
        recognition.onerror = () => {
            speakBtn.classList.remove('listening');
            feedbackArea.textContent = "✖";
            feedbackArea.className = "feedback incorrect";
        };
    }


  </script>
</body>
</html>
