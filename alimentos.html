<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprende Alimentos</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fce4ec;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 380px;
            width: 90%;
        }

        .object-box {
            width: 100%;
            height: 160px;
            background-color: #f8f0f6;
            border-radius: 15px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
        }

        .word-label {
            font-size: 30px;
            font-weight: bold;
            color: #1a252f;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .translation-label {
            font-size: 18px;
            color: #7f8c8d;
            margin-bottom: 20px;
            font-style: italic;
        }

        .buttons-container {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .action-btn {
            background-color: #f0f0f0;
            border: 2px solid #e0e0e0;
            border-radius: 50%;
            width: 55px;
            height: 55px;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .next-btn-style {
            background-color: #3498db;
            color: white;
            border-color: #2980b9;
        }

        .feedback {
            font-size: 40px;
            height: 50px;
            line-height: 50px;
            margin-top: 10px;
        }

        .correct { color: #4caf50; }
        .incorrect { color: #f44336; }
    </style>
</head>
<body>

<div class="container">
    <div class="object-box" id="objectBox">🧈</div>
    <div class="word-label" id="wordLabel">BUTTER</div>
    <div class="translation-label" id="translationLabel">(Mantequilla)</div>

    <div class="buttons-container">
        <button class="action-btn" id="listenBtn" title="Escuchar">🔊</button>
        <button class="action-btn" id="speakBtn" title="Pronunciar">🎧</button>
        <button class="action-btn next-btn-style" id="nextBtn" title="Siguiente">➡️</button>
    </div>

    <div class="feedback" id="feedbackArea"></div>
</div>

<script>
    const items = [
        { name: "butter", translation: "Mantequilla", emoji: "🧈" },
        { name: "coffee", translation: "Café", emoji: "☕" },
        { name: "apple", translation: "Manzana", emoji: "🍎" },
        { name: "banana", translation: "Plátano", emoji: "🍌" },
        { name: "bread", translation: "Pan", emoji: "🍞" },
        { name: "cheese", translation: "Queso", emoji: "🧀" },
        { name: "milk", translation: "Leche", emoji: "🥛" },
        { name: "water", translation: "Agua", emoji: "💧" },
        { name: "egg", translation: "Huevo", emoji: "🥚" },
        { name: "pizza", translation: "Pizza", emoji: "🍕" }
    ];

    let currentIdx = 0;

    const objectBox = document.getElementById('objectBox');
    const wordLabel = document.getElementById('wordLabel');
    const translationLabel = document.getElementById('translationLabel');
    const listenBtn = document.getElementById('listenBtn');
    const speakBtn = document.getElementById('speakBtn');
    const nextBtn = document.getElementById('nextBtn');
    const feedbackArea = document.getElementById('feedbackArea');

    function showItem(index) {
        const item = items[index];
        objectBox.textContent = item.emoji;
        wordLabel.textContent = item.name;
        translationLabel.textContent = `(${item.translation})`;
        feedbackArea.textContent = "";
    }

    showItem(currentIdx);

    nextBtn.addEventListener('click', () => {
        currentIdx = (currentIdx + 1) % items.length;
        showItem(currentIdx);
    });

    listenBtn.addEventListener('click', () => {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(items[currentIdx].name);
            utterance.lang = 'en-US';
            utterance.rate = 0.8;
            window.speechSynthesis.speak(utterance);
        }
    });

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';

        speakBtn.addEventListener('click', () => {
            feedbackArea.textContent = "";
            recognition.start();
        });

        recognition.onresult = (event) => {
            const spokenWord = event.results[0][0].transcript.toLowerCase().trim();
            const targetWord = items[currentIdx].name;

            if (spokenWord.includes(targetWord)) {
                feedbackArea.textContent = "✔";
                feedbackArea.className = "feedback correct";
                setTimeout(() => {
                    currentIdx = (currentIdx + 1) % items.length;
                    showItem(currentIdx);
                }, 1200);
            } else {
                feedbackArea.textContent = "✖";
                feedbackArea.className = "feedback incorrect";
            }
        };
    }
</script>

</body>
</html>
