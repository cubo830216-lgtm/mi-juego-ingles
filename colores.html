<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprende los Colores</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        /* Cuadro de color dinámico */
        .color-box {
            width: 100%;
            height: 180px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
            transition: background-color 0.4s ease;
        }

        .word-label {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .buttons-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .action-btn {
            background-color: #f0f0f0;
            border: 2px solid #e0e0e0;
            border-radius: 50%;
            width: 70px;
            height: 70px;
            font-size: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn:hover {
            transform: scale(1.08);
            background-color: #e8e8e8;
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .feedback {
            font-size: 60px;
            height: 70px;
            line-height: 70px;
            margin-top: 10px;
        }

        .correct { color: #4caf50; }
        .incorrect { color: #f44336; }

        .listening {
            animation: pulse 1.2s infinite;
            border-color: #2196f3 !important;
            background-color: #e3f2fd !important;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="color-box" id="colorBox"></div>
    <div class="word-label" id="wordLabel">---</div>

    <div class="buttons-container">
        <button class="action-btn" id="listenBtn" title="Escuchar la palabra">🔊</button>
        <button class="action-btn" id="speakBtn" title="Pronunciar la palabra">🎧</button>
    </div>

    <div class="feedback" id="feedbackArea"></div>
</div>

<script>
    // Arreglo con la lista de colores
    const colors = [
        { name: "pink", hex: "#ff69b4" },
        { name: "red", hex: "#f44336" },
        { name: "blue", hex: "#2196f3" },
        { name: "green", hex: "#4caf50" },
        { name: "yellow", hex: "#ffeb3b" },
        { name: "orange", hex: "#ff9800" },
        { name: "purple", hex: "#9c27b0" },
        { name: "black", hex: "#212121" },
        { name: "white", hex: "#ffffff" }
    ];

    let currentIdx = -1;
    const colorBox = document.getElementById('colorBox');
    const wordLabel = document.getElementById('wordLabel');
    const listenBtn = document.getElementById('listenBtn');
    const speakBtn = document.getElementById('speakBtn');
    const feedbackArea = document.getElementById('feedbackArea');
    const nextBtn = document.getElementById('nextBtn');

    // Cambia a un color aleatorio
    function setRandomColor() {
        let newIdx;
        do {
            newIdx = Math.floor(Math.random() * colors.length);
        } while (newIdx === currentIdx && colors.length > 1);

        currentIdx = newIdx;
        const currentColor = colors[currentIdx];

        colorBox.style.backgroundColor = currentColor.hex;
        wordLabel.textContent = currentColor.name;
        wordLabel.style.color = currentColor.hex === "#ffffff" ? "#000000" : currentColor.hex;
    }

    // Inicializar el primer color
    setRandomColor();

    // Reproducir pronunciación
    listenBtn.addEventListener('click', () => {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(colors[currentIdx].name);
            utterance.lang = 'en-US';
            utterance.rate = 0.8;
            window.speechSynthesis.speak(utterance);
        }
    });

    // Reconocimiento de voz
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        speakBtn.addEventListener('click', () => {
            feedbackArea.textContent = "";
            feedbackArea.className = "feedback";
            speakBtn.classList.add('listening');
            recognition.start();
        });

        recognition.onresult = (event) => {
            speakBtn.classList.remove('listening');
            const spokenWord = event.results[0][0].transcript.toLowerCase().trim();
            const targetWord = colors[currentIdx].name;

            if (spokenWord.includes(targetWord)) {
                feedbackArea.textContent = "✔";
                feedbackArea.className = "feedback correct";
                
                // Cambiar al siguiente color tras 1 segundo
                setTimeout(() => {
                    feedbackArea.textContent = "";
                    setRandomColor();
                }, 1200);
            } else {
                feedbackArea.textContent = "✖";
                feedbackArea.className = "feedback incorrect";
            }
        };

        recognition.onspeechend = () => speakBtn.classList.remove('listening');
        recognition.onerror = () => {
            speakBtn.classList.remove('listening');
            feedbackArea.textContent = "✖";
            feedbackArea.className = "feedback incorrect";
        };
    }
</script>

</body>
</html>
