<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprende los Días de la Semana en Inglés</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .day-box {
            width: 100%;
            height: 180px;
            background-color: #eef2f5;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
        }

        .word-label {
            font-size: 32px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .translation-label {
            font-size: 18px;
            color: #7f8c8d;
            margin-bottom: 25px;
            font-style: italic;
        }

        .buttons-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .action-btn {
            background-color: #f0f0f0;
            border: 2px solid #e0e0e0;
            border-radius: 50%;
            width: 70px;
            height: 70px;
            font-size: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn:hover {
            transform: scale(1.08);
            background-color: #e8e8e8;
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .next-btn {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 12px;
            background-color: #3498db;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(52,152,219,0.25);
            margin-bottom: 10px;
        }

        .next-btn:hover {
            background-color: #2980b9;
            transform: translateY(-1px);
        }

        .next-btn:active {
            transform: scale(0.98);
        }

        .feedback {
            font-size: 60px;
            height: 70px;
            line-height: 70px;
            margin-top: 10px;
        }

        .correct {
            color: #4caf50;
        }

        .incorrect {
            color: #f44336;
        }

        .listening {
            animation: pulse 1.2s infinite;
            border-color: #3498db !important;
            background-color: #ebf5fb !important;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="day-box" id="dayBox">📅</div>

    <div class="word-label" id="wordLabel">MONDAY</div>

    <div class="translation-label" id="translationLabel">
        (Lunes)
    </div>

    <div class="buttons-container">

        <!-- Escuchar pronunciación -->
        <button
            class="action-btn"
            id="listenBtn"
            title="Escuchar la palabra">
            🔊
        </button>

        <!-- Pronunciar palabra -->
        <button
            class="action-btn"
            id="speakBtn"
            title="Pronunciar la palabra">
            🎧
        </button>

    </div>

    <!-- BOTÓN SIGUIENTE -->
    <button
        class="next-btn"
        id="nextBtn">
        ➡️ Siguiente
    </button>

    <div class="feedback" id="feedbackArea"></div>

</div>


<script>

    // ==========================================
    // LISTA DE DÍAS
    // ==========================================

    const days = [
        { name: "monday", translation: "Lunes", emoji: "🌙" },
        { name: "tuesday", translation: "Martes", emoji: "🔥" },
        { name: "wednesday", translation: "Miércoles", emoji: "🌎" },
        { name: "thursday", translation: "Jueves", emoji: "⚡" },
        { name: "friday", translation: "Viernes", emoji: "🎉" },
        { name: "saturday", translation: "Sábado", emoji: "☀️" },
        { name: "sunday", translation: "Domingo", emoji: "🌞" }
    ];


    // ==========================================
    // ELEMENTOS
    // ==========================================

    let currentIdx = 0;

    const dayBox =
        document.getElementById('dayBox');

    const wordLabel =
        document.getElementById('wordLabel');

    const translationLabel =
        document.getElementById('translationLabel');

    const listenBtn =
        document.getElementById('listenBtn');

    const speakBtn =
        document.getElementById('speakBtn');

    const nextBtn =
        document.getElementById('nextBtn');

    const feedbackArea =
        document.getElementById('feedbackArea');


    // ==========================================
    // MOSTRAR DÍA ACTUAL
    // ==========================================

    function setDay() {

        const currentDay =
            days[currentIdx];


        dayBox.textContent =
            currentDay.emoji;


        wordLabel.textContent =
            currentDay.name.toUpperCase();


        translationLabel.textContent =
            `(${currentDay.translation})`;


        // Limpiar resultado anterior
        feedbackArea.textContent = "";

        feedbackArea.className =
            "feedback";
    }


    // ==========================================
    // PRIMER DÍA
    // ==========================================

    setDay();


    // ==========================================
    // ESCUCHAR PRONUNCIACIÓN
    // ==========================================

    listenBtn.addEventListener('click', () => {

        if ('speechSynthesis' in window) {

            // Detener pronunciación anterior
            window.speechSynthesis.cancel();


            const utterance =
                new SpeechSynthesisUtterance(
                    days[currentIdx].name
                );


            utterance.lang =
                'en-US';


            // Pronunciación lenta
            utterance.rate =
                0.8;


            window.speechSynthesis.speak(
                utterance
            );
        }

    });


    // ==========================================
    // RECONOCIMIENTO DE VOZ
    // ==========================================

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    let recognition = null;


    if (SpeechRecognition) {

        recognition =
            new SpeechRecognition();


        recognition.lang =
            'en-US';


        recognition.interimResults =
            false;


        recognition.maxAlternatives =
            1;


        // ======================================
        // BOTÓN PRONUNCIAR
        // ======================================

        speakBtn.addEventListener('click', () => {

            feedbackArea.textContent =
                "";

            feedbackArea.className =
                "feedback";


            speakBtn.classList.add(
                'listening'
            );


            try {

                recognition.start();

            } catch (error) {

                console.log(
                    "El reconocimiento ya estaba activo."
                );

            }

        });


        // ======================================
        // RESULTADO
        // ======================================

        recognition.onresult =
            (event) => {

                speakBtn.classList.remove(
                    'listening'
                );


                const spokenWord =
                    event.results[0][0]
                        .transcript
                        .toLowerCase()
                        .trim();


                const targetWord =
                    days[currentIdx].name;


                // Comprobar pronunciación
                if (
                    spokenWord.includes(
                        targetWord
                    )
                ) {

                    feedbackArea.textContent =
                        "✔";


                    feedbackArea.className =
                        "feedback correct";


                    // Cambiar automáticamente
                    // después de 1.2 segundos
                    setTimeout(() => {

                        feedbackArea.textContent =
                            "";

                        nextDay();

                    }, 1200);


                } else {

                    feedbackArea.textContent =
                        "✖";


                    feedbackArea.className =
                        "feedback incorrect";

                }

            };


        // ======================================
        // TERMINÓ DE HABLAR
        // ======================================

        recognition.onspeechend = () => {

            speakBtn.classList.remove(
                'listening'
            );

        };


        // ======================================
        // ERROR
        // ======================================

        recognition.onerror = () => {

            speakBtn.classList.remove(
                'listening'
            );


            feedbackArea.textContent =
                "✖";


            feedbackArea.className =
                "feedback incorrect";

        };

    }


    // ==========================================
    // SIGUIENTE DÍA
    // ==========================================

    function nextDay() {

        // Avanzar al siguiente día
        currentIdx++;


        // ======================================
        // SI LLEGAMOS AL FINAL,
        // VOLVER AL PRIMERO
        // ======================================

        if (currentIdx >= days.length) {

            currentIdx = 0;

        }


        setDay();

    }


    // ==========================================
    // BOTÓN SIGUIENTE
    // ==========================================

    nextBtn.addEventListener('click', () => {

        // Detener el micrófono
        if (recognition) {

            try {

                recognition.abort();

            } catch (error) {

                console.log(
                    "Reconocimiento detenido."
                );

            }

        }


        // Quitar animación del botón
        speakBtn.classList.remove(
            'listening'
        );


        // Detener la pronunciación
        if ('speechSynthesis' in window) {

            window.speechSynthesis.cancel();

        }


        // Mostrar siguiente día
        nextDay();

    });

</script>

</body>
</html>
