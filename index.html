<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi App Dinámica</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    /* Frame 1: Título Superior */
    header {
      height: 50px;
      background-color: #ffc0cb;
      color: #d81b60;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    /* Frame 2: Menú Horizontal Superior */
    nav.barramenu {
      background-color: #ffc0cb; /* Cambiado a rosa */
      border-bottom: 2px solid #f8a5c2;
      display: flex;
    }
    .menu-item {
      position: relative;
    }
    .menu-btn {
      background: none;
      border: none;
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      color: #d81b60; /* Texto coordinado con el título */
      display: inline-block;
    }
    .menu-btn:hover {
      background-color: #f8a5c2;
    }
    
    /* Submenú desplegable flotante */
    .sub-menu {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background-color: #ffc0cb; /* Cambiado a rosa */
      min-width: 180px;
      box-shadow: 0px 4px 8px rgba(0,0,0,0.15);
      border: 1px solid #f8a5c2;
      z-index: 100;
    }
    .menu-item:hover .sub-menu {
      display: block;
    }
    .sub-menu a {
      color: #d81b60;
      padding: 10px 15px;
      text-decoration: none;
      display: block;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .sub-menu a:hover {
      background-color: #d81b60;
      color: white;
    }
    
    /* Frame 3: Body / Main */
    main {
      flex: 1;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Frame 1: Título -->
  <header>
    <h1>¡ Hola, Madison !</h1>
  </header>

  <!-- Frame 2: Menú desplegable -->
  <nav class="barramenu">
    <div class="menu-item">
      <button class="menu-btn">🗣️ Vocalizar</button>
      <div id="sub-vocalizar" class="sub-menu"></div>
    </div>
    <div class="menu-item">
      <button class="menu-btn">✏️ Escribir</button>
      <div id="sub-escribir" class="sub-menu"></div>
    </div>
    <!-- Opción Mixto con submenú -->
    <div class="menu-item">
      <button class="menu-btn">🔄 Mixto</button>
      <div id="sub-mixto" class="sub-menu"></div>
    </div>
  </nav>

  <!-- Frame 3: Cuerpo donde cargan los html -->
  <main>
    <iframe name="cuerpo" id="frame-cuerpo" src="about:blank"></iframe>
  </main>

  <!-- Carga del catálogo local -->
  <script src="catalogo.js"></script>
  <script>
    // Variable GLOBAL para guardar el grupo activo
    window.grupoSeleccionado = "";

    // Función para actualizar la variable global y cambiar el iframe
    function seleccionarGrupo(grupo, pagina) {
      window.grupoSeleccionado = grupo;
      console.log("Grupo seleccionado actualmente:", window.grupoSeleccionado);
      // Llama a la página correspondiente en el iframe
      document.getElementById('frame-cuerpo').src = `${pagina}?grupo=${grupo}`;
    }

    const subVocalizar = document.getElementById('sub-vocalizar');
    const subEscribir = document.getElementById('sub-escribir');
    const subMixto = document.getElementById('sub-mixto');

    // Construcción dinámica de los tres submenús con auto-cierre en móviles
    if (window.catalogoGlobal && Array.isArray(window.catalogoGlobal)) {
      window.catalogoGlobal.forEach(cat => {
        // Enlace para Vocalizar
        const aVocalizar = document.createElement('a');
        aVocalizar.innerText = `${cat.emoji || ''} ${cat.titulo}`;
        aVocalizar.onclick = () => {
          seleccionarGrupo(cat.grupo, 'vocalizar.html');
          if (document.activeElement) document.activeElement.blur();
        };
        subVocalizar.appendChild(aVocalizar);

        // Enlace para Escribir
        const aEscribir = document.createElement('a');
        aEscribir.innerText = `${cat.emoji || ''} ${cat.titulo}`;
        aEscribir.onclick = () => {
          seleccionarGrupo(cat.grupo, 'escribir.html');
          if (document.activeElement) document.activeElement.blur();
        };
        subEscribir.appendChild(aEscribir);

        // Enlace para Mixto
        const aMixto = document.createElement('a');
        aMixto.innerText = `${cat.emoji || ''} ${cat.titulo}`;
        aMixto.onclick = () => {
          seleccionarGrupo(cat.grupo, 'mixto.html');
          if (document.activeElement) document.activeElement.blur();
        };
        subMixto.appendChild(aMixto);
      });
    }
  </script>
</body>
</html>
