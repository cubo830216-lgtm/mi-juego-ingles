<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi App con iFrame</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        /* Usamos vh y dvh para adaptar el alto exacto de la pantalla */
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh; 
            overflow: hidden;
        }

        header {
            background: #fce4ec; /* Rosa magenta fuerte */
            color: white;
            padding: 12px;
            text-align: center;
        }

        .layout {
            display: flex;
            flex: 1;
            flex-direction: row; /* En PC / Laptop va lado a lado */
            overflow: hidden;
        }

        aside {
            width: 200px;
            background: #fce4ec; /* Rosa pastel */
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        aside a {
            display: block;
            background: #8e44ad; /* Botones morados */
            color: white;
            text-decoration: none;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }

        main {
            flex: 1;
            background: #ecf0f1;
            width: 100%;
            height: 100%;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* VISTA PARA CELULARES Y TABLETS EN VERTICAL */
        @media (max-width: 768px) {
            .layout {
                flex-direction: column; /* Cambia a disposición vertical */
            }

            aside {
                width: 100%; /* El menú toma el 100% del ancho */
                flex-direction: row; /* Los botones se acomodan en fila */
                justify-content: space-around;
                padding: 10px 5px;
            }

            aside a {
                padding: 8px 10px;
                font-size: 14px;
                margin-bottom: 0;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>👑 ¡Hola, Madison! 👑</h1>
    <p>Aprende Inglés Jugando</p>
</header>

<div class="layout">
    <aside>
        <a href="colores.html" target="visor">🎨 Colores</a>
        <a href="verbos.html" target="visor">🏃 Verbos</a>
        <a href="alimentos.html" target="visor">🍔 Alimentos</a>
        <a href="objetos.html" target="visor">🏠 Objetos</a>
    </aside>
    <main>
        <iframe name="visor" src="colores.html"></iframe>
    </main>
</div>

</body>
</html>
