<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi App Dinámica</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    /* Frame 1: Encabezado */
    header {
      height: 50px;
      background-color: #ffc0cb;
      color: #d81b60;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    /* Frame 2: Navegación Principal */
    nav.barramenu {
      background-color: #ffc0cb;
      border-bottom: 2px solid #f8a5c2;
      display: flex;
    }
    .menu-item {
      position: relative;
    }
    .menu-btn {
      background: none;
      border: none;
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      color: #d81b60;
    }
    .menu-btn:hover {
      background-color: #f8a5c2;
    }
    
    /* Submenú Nivel 1 */
    .sub-menu {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background-color: #ffc0cb;
      min-width: 180px;
      box-shadow: 0px 4px 8px rgba(0,0,0,0.15);
      border: 1px solid #f8a5c2;
      z-index: 100;
    }
    .menu-item.open .sub-menu {
      display: block;
    }
    @media (hover: hover) {
      .menu-item:hover .sub-menu {
        display: block;
      }
    }

    .sub-menu a, .sub-menu .submenu-padre {
      color: #d81b60;
      padding: 10px 15px;
      text-decoration: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .sub-menu a:hover, .sub-menu .submenu-padre:hover {
      background-color: #d81b60;
      color: white;
    }

    /* Submenú Nivel 2 (Desplegable Lateral) */
    .submenu-padre-wrapper {
      position: relative;
    }

    .submenu-hijos {
      display: none;
      position: absolute;
      left: 100%;
      top: 0;
      background-color: #ffc0cb;
      min-width: 160px;
      border: 1px solid #f8a5c2;
      box-shadow: 2px 4px 8px rgba(0,0,0,0.15);
      z-index: 101;
    }

    .submenu-padre-wrapper:hover .submenu-hijos {
      display: block;
    }

    /* Clase CSS que invierte la apertura si falta espacio a la derecha */
    .submenu-hijos.abrir-izquierda {
      left: auto !important;
      right: 100% !important;
      box-shadow: -2px 4px 8px rgba(0,0,0,0.15) !important;
    }

    /* Frame 3: Iframe principal */
    main {
      flex: 1;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>¡ Hola, Madison ..!</h1>
  </header>

  <nav class="barramenu">
    <div class="menu-item">
      <button class="menu-btn" onclick="toggleMenu(this)">🗣️ Vocalizar</button>
      <div id="sub-vocalizar" class="sub-menu"></div>
    </div>
    <div class="menu-item">
      <button class="menu-btn" onclick="toggleMenu(this)">✏️ Escribir</button>
      <div id="sub-escribir" class="sub-menu"></div>
    </div>
    <div class="menu-item">
      <button class="menu-btn" onclick="toggleMenu(this)">🔄 Mixto</button>
      <div id="sub-mixto" class="sub-menu"></div>
    </div>
  </nav>

  <main>
    <iframe name="cuerpo" id="frame-cuerpo" src="about:blank"></iframe>
  </main>

  <script src="catalogo.js"></script>
  <script>
    window.grupoSeleccionado = "";

    function toggleMenu(button) {
      const currentItem = button.parentElement;
      const isOpen = currentItem.classList.contains('open');
      cerrarTodosLosMenus();
      if (!isOpen) currentItem.classList.add('open');
    }

    function cerrarTodosLosMenus() {
      document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('open'));
    }

    function seleccionarGrupo(grupo, pagina) {
      window.grupoSeleccionado = grupo;
      document.getElementById('frame-cuerpo').src = `${pagina}?grupo=${grupo}`;
      cerrarTodosLosMenus();
      if (document.activeElement) document.activeElement.blur();
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.barramenu')) cerrarTodosLosMenus();
    });

    document.addEventListener('DOMContentLoaded', () => {
      const datos = window.catalogoGlobal || window.palabrasGlobal;

      if (datos && Array.isArray(datos)) {
        const subVocalizar = document.getElementById('sub-vocalizar');
        const subEscribir = document.getElementById('sub-escribir');
        const subMixto = document.getElementById('sub-mixto');

        const padres = datos.filter(cat => cat.grupo && cat.grupo.startsWith('X'));
        const normales = datos.filter(cat => cat.grupo && !cat.grupo.startsWith('X'));

        // Parámetro "detectarEspacio": controla si se evalúa el borde derecho
        function armarMenu(contenedor, pagina, detectarEspacio = false) {
          contenedor.innerHTML = '';
          
          padres.forEach(padre => {
            const prefijo = padre.grupo.substring(1);
            const hijos = normales.filter(h => h.grupo.startsWith(prefijo));

            if (hijos.length > 0) {
              const wrapper = document.createElement('div');
              wrapper.className = 'submenu-padre-wrapper';

              const btnPadre = document.createElement('div');
              btnPadre.className = 'submenu-padre';
              btnPadre.innerHTML = `<span>${padre.emoji || ''} ${padre.titulo}</span> <span>▶</span>`;
              wrapper.appendChild(btnPadre);

              const contenedorHijos = document.createElement('div');
              contenedorHijos.className = 'submenu-hijos';

              hijos.forEach(h => {
                const aHijo = document.createElement('a');
                aHijo.innerText = `${h.emoji || ''} ${h.titulo}`;
                aHijo.onclick = (e) => {
                  e.preventDefault();
                  seleccionarGrupo(h.grupo, pagina);
                };
                contenedorHijos.appendChild(aHijo);
              });

              wrapper.appendChild(contenedorHijos);

              // Solo evalúa si detectarEspacio es true (Escribir y Mixto)
              if (detectarEspacio) {
                wrapper.addEventListener('mouseenter', () => {
                  const rect = wrapper.getBoundingClientRect();
                  const anchoPantalla = window.innerWidth || document.documentElement.clientWidth;
                  
                  if (rect.right + 160 > anchoPantalla) {
                    contenedorHijos.classList.add('abrir-izquierda');
                  } else {
                    contenedorHijos.classList.remove('abrir-izquierda');
                  }
                });
              }

              contenedor.appendChild(wrapper);
            }
          });

          const huerfanos = normales.filter(h => !padres.some(p => h.grupo.startsWith(p.grupo.substring(1))));
          huerfanos.forEach(cat => {
            const a = document.createElement('a');
            a.innerText = `${cat.emoji || ''} ${cat.titulo}`;
            a.onclick = (e) => {
              e.preventDefault();
              seleccionarGrupo(cat.grupo, pagina);
            };
            contenedor.appendChild(a);
          });
        }

        // --- LLAMADAS CON CONTROL DE EVALUACIÓN ---
        armarMenu(subVocalizar, 'vocalizar.html', false); // Menú 1: Siempre a la derecha
        armarMenu(subEscribir, 'escribir.html', true);     // Menú 2: Evalúa espacio
        armarMenu(subMixto, 'mixto.html', true);          // Menú 3: Evalúa espacio
      }
    });
  </script>
</body>
</html>
