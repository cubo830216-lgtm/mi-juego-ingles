<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprende los Números en Inglés</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .number-box {
            width: 100%;
            height: 180px;
            background-color: #eef2f5;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 100px;
            font-weight: bold;
            color: #3498db;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }

        .word-label {
            font-size: 32px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .translation-label {
            font-size: 18px;
            color: #7f8c8d;
            margin-bottom: 25px;
            font-style: italic;
        }

        .buttons-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .action-btn {
            background-color: #f0f0f0;
            border: 2px solid #e0e0e0;
            border-radius: 50%;
            width: 70px;
            height: 70px;
            font-size: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn:hover {
            transform: scale(1.08);
            background-color: #e8e8e8;
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .next-btn {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 12px;
            background-color: #3498db;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(52,152,219,0.25);
            margin-bottom: 10px;
        }

        .next-btn:hover {
            background-color: #2980b9;
            transform: translateY(-1px);
        }

        .next-btn:active {
            transform: scale(0.98);
        }

        .feedback {
            font-size: 60px;
            height: 70px;
            line-height: 70px;
            margin-top: 10px;
        }

        .correct {
            color: #4caf50;
        }

        .incorrect {
            color: #f44336;
        }

        .listening {
            animation: pulse 1.2s infinite;
            border-color: #3498db !important;
            background-color: #ebf5fb !important;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="number-box" id="numberBox">1</div>

    <div class="word-label" id="wordLabel">ONE</div>

    <div class="translation-label" id="translationLabel">
        (Uno)
    </div>

    <div class="buttons-container">

        <!-- Escuchar pronunciación -->
        <button
            class="action-btn"
            id="listenBtn"
            title="Escuchar el número">
            🔊
        </button>

        <!-- Pronunciar número -->
        <button
            class="action-btn"
            id="speakBtn"
            title="Pronunciar el número">
            🎧
        </button>

    </div>

    <!-- BOTÓN SIGUIENTE -->
    <button
        class="next-btn"
        id="nextBtn">
        ➡️ Siguiente
    </button>

    <div class="feedback" id="feedbackArea"></div>

</div>


<script>

    // ==========================================
    // LISTA DE NÚMEROS
    // ==========================================

    const numbers = [
        { number: 1,  name: "one",       translation: "Uno" },
        { number: 2,  name: "two",       translation: "Dos" },
        { number: 3,  name: "three",     translation: "Tres" },
        { number: 4,  name: "four",      translation: "Cuatro" },
        { number: 5,  name: "five",      translation: "Cinco" },
        { number: 6,  name: "six",       translation: "Seis" },
        { number: 7,  name: "seven",     translation: "Siete" },
        { number: 8,  name: "eight",     translation: "Ocho" },
        { number: 9,  name: "nine",      translation: "Nueve" },
        { number: 10, name: "ten",       translation: "Diez" },
        { number: 11, name: "eleven",    translation: "Once" },
        { number: 12, name: "twelve",    translation: "Doce" },
        { number: 13, name: "thirteen",  translation: "Trece" },
        { number: 14, name: "fourteen",  translation: "Catorce" },
        { number: 15, name: "fifteen",   translation: "Quince" },
        { number: 16, name: "sixteen",   translation: "Dieciséis" },
        { number: 17, name: "seventeen", translation: "Diecisiete" },
        { number: 18, name: "eighteen",  translation: "Dieciocho" },
        { number: 19, name: "nineteen",  translation: "Diecinueve" },
        { number: 20, name: "twenty",    translation: "Veinte" }
    ];


    // ==========================================
    // ELEMENTOS
    // ==========================================

    let currentIdx = 0;

    const numberBox =
        document.getElementById('numberBox');

    const wordLabel =
        document.getElementById('wordLabel');

    const translationLabel =
        document.getElementById('translationLabel');

    const listenBtn =
        document.getElementById('listenBtn');

    const speakBtn =
        document.getElementById('speakBtn');

    const nextBtn =
        document.getElementById('nextBtn');

    const feedbackArea =
        document.getElementById('feedbackArea');


    // ==========================================
    // MOSTRAR NÚMERO ACTUAL
    // ==========================================

    function setNumber() {

        const currentNumber =
            numbers[currentIdx];


        numberBox.textContent =
            currentNumber.number;


        wordLabel.textContent =
            currentNumber.name.toUpperCase();


        translationLabel.textContent =
            `(${currentNumber.translation})`;


        // Limpiar resultado anterior
        feedbackArea.textContent = "";

        feedbackArea.className =
            "feedback";
    }


    // ==========================================
    // PRIMER NÚMERO
    // ==========================================

    setNumber();


    // ==========================================
    // ESCUCHAR PRONUNCIACIÓN
    // ==========================================

    listenBtn.addEventListener('click', () => {

        if ('speechSynthesis' in window) {

            // Detener pronunciación anterior
            window.speechSynthesis.cancel();


            const utterance =
                new SpeechSynthesisUtterance(
                    numbers[currentIdx].name
                );


            utterance.lang =
                'en-US';


            // Pronunciación lenta
            utterance.rate =
                0.8;


            window.speechSynthesis.speak(
                utterance
            );
        }

    });


    // ==========================================
    // RECONOCIMIENTO DE VOZ
    // ==========================================

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    let recognition = null;


    if (SpeechRecognition) {

        recognition =
            new SpeechRecognition();


        recognition.lang =
            'en-US';


        recognition.interimResults =
            false;


        recognition.maxAlternatives =
            1;


        // ======================================
        // BOTÓN PRONUNCIAR
        // ======================================

        speakBtn.addEventListener('click', () => {

            feedbackArea.textContent =
                "";

            feedbackArea.className =
                "feedback";


            speakBtn.classList.add(
                'listening'
            );


            try {

                recognition.start();

            } catch (error) {

                console.log(
                    "El reconocimiento ya estaba activo."
                );

            }

        });


        // ======================================
        // RESULTADO
        // ======================================

        recognition.onresult =
            (event) => {

                speakBtn.classList.remove(
                    'listening'
                );


                const spokenWord =
                    event.results[0][0]
                        .transcript
                        .toLowerCase()
                        .trim();


                const targetWord =
                    numbers[currentIdx].name;


                // Comprobar pronunciación
                if (
                    spokenWord.includes(
                        targetWord
                    )
                ) {

                    feedbackArea.textContent =
                        "✔";


                    feedbackArea.className =
                        "feedback correct";


                    // Cambiar automáticamente
                    // después de 1.2 segundos
                    setTimeout(() => {

                        feedbackArea.textContent =
                            "";

                        nextNumber();

                    }, 1200);


                } else {

                    feedbackArea.textContent =
                        "✖";


                    feedbackArea.className =
                        "feedback incorrect";

                }

            };


        // ======================================
        // TERMINÓ DE HABLAR
        // ======================================

        recognition.onspeechend = () => {

            speakBtn.classList.remove(
                'listening'
            );

        };


        // ======================================
        // ERROR
        // ======================================

        recognition.onerror = () => {

            speakBtn.classList.remove(
                'listening'
            );


            feedbackArea.textContent =
                "✖";


            feedbackArea.className =
                "feedback incorrect";

        };

    }


    // ==========================================
    // SIGUIENTE NÚMERO
    // ==========================================

    function nextNumber() {

        // Avanzar al siguiente número
        currentIdx++;


        // ======================================
        // SI LLEGAMOS AL 20,
        // VOLVER AL 1
        // ======================================

        if (currentIdx >= numbers.length) {

            currentIdx = 0;

        }


        setNumber();

    }


    // ==========================================
    // BOTÓN SIGUIENTE
    // ==========================================

    nextBtn.addEventListener('click', () => {

        // Detener el micrófono
        if (recognition) {

            try {

                recognition.abort();

            } catch (error) {

                console.log(
                    "Reconocimiento detenido."
                );

            }

        }


        // Quitar animación del botón
        speakBtn.classList.remove(
            'listening'
        );


        // Detener la pronunciación
        if ('speechSynthesis' in window) {

            window.speechSynthesis.cancel();

        }


        // Mostrar siguiente número
        nextNumber();

    });

</script>

</body>
</html>
