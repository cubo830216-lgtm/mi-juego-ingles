<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprende Objetos del Hogar</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .object-box {
            width: 100%;
            height: 180px;
            background-color: #f0f3f8;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }

        .word-label {
            font-size: 32px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .translation-label {
            font-size: 18px;
            color: #7f8c8d;
            margin-bottom: 25px;
            font-style: italic;
        }

        .buttons-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .action-btn {
            background-color: #f0f0f0;
            border: 2px solid #e0e0e0;
            border-radius: 50%;
            width: 70px;
            height: 70px;
            font-size: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn:hover {
            transform: scale(1.08);
            background-color: #e8e8e8;
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        /* BOTÓN SIGUIENTE */
        .next-btn {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 12px;
            background-color: #9b59b6;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(155,89,182,0.25);
            margin-bottom: 10px;
        }

        .next-btn:hover {
            background-color: #8e44ad;
            transform: translateY(-1px);
        }

        .next-btn:active {
            transform: scale(0.98);
        }

        .feedback {
            font-size: 60px;
            height: 70px;
            line-height: 70px;
            margin-top: 10px;
        }

        .correct {
            color: #4caf50;
        }

        .incorrect {
            color: #f44336;
        }

        .listening {
            animation: pulse 1.2s infinite;
            border-color: #9b59b6 !important;
            background-color: #f5eeef !important;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="object-box" id="objectBox">🍴</div>

    <div class="word-label" id="wordLabel">FORK</div>

    <div class="translation-label" id="translationLabel">
        (Tenedor)
    </div>

    <div class="buttons-container">

        <!-- Escuchar la pronunciación -->
        <button
            class="action-btn"
            id="listenBtn"
            title="Escuchar la palabra">
            🔊
        </button>

        <!-- Pronunciar la palabra -->
        <button
            class="action-btn"
            id="speakBtn"
            title="Pronunciar la palabra">
            🎧
        </button>

    </div>

    <!-- BOTÓN SIGUIENTE -->
    <button
        class="next-btn"
        id="nextBtn">
        ➡️ Siguiente
    </button>

    <div class="feedback" id="feedbackArea"></div>

</div>


<script>

    // ==========================================
    // OBJETOS DEL HOGAR
    // ==========================================

    const items = [
        { name: "fork", translation: "Tenedor", emoji: "🍴" },
        { name: "spoon", translation: "Cuchara", emoji: "🥄" },
        { name: "chair", translation: "Silla", emoji: "🪑" },
        { name: "table", translation: "Mesa", emoji: "🛋️" },
        { name: "sofa", translation: "Sofá", emoji: "🛋️" },
        { name: "door", translation: "Puerta", emoji: "🚪" },
        { name: "fan", translation: "Ventilador", emoji: "🌀" },
        { name: "television", translation: "Televisor", emoji: "📺" },
        { name: "radio", translation: "Radio", emoji: "📻" },
        { name: "plate", translation: "Plato", emoji: "🍽️" },
        { name: "napkin", translation: "Servilleta", emoji: "🧻" },
        { name: "oven", translation: "Horno", emoji: "🧱" }
    ];


    // ==========================================
    // ELEMENTOS
    // ==========================================

    let currentIdx = -1;

    const objectBox =
        document.getElementById('objectBox');

    const wordLabel =
        document.getElementById('wordLabel');

    const translationLabel =
        document.getElementById('translationLabel');

    const listenBtn =
        document.getElementById('listenBtn');

    const speakBtn =
        document.getElementById('speakBtn');

    const nextBtn =
        document.getElementById('nextBtn');

    const feedbackArea =
        document.getElementById('feedbackArea');


    // ==========================================
    // CAMBIAR A OTRO OBJETO
    // ==========================================

    function setRandomItem() {

        let newIdx;

        do {

            newIdx =
                Math.floor(
                    Math.random() * items.length
                );

        } while (
            newIdx === currentIdx &&
            items.length > 1
        );


        currentIdx = newIdx;

        const currentItem =
            items[currentIdx];


        objectBox.textContent =
            currentItem.emoji;


        wordLabel.textContent =
            currentItem.name.toUpperCase();


        translationLabel.textContent =
            `(${currentItem.translation})`;


        // Limpiar resultado anterior
        feedbackArea.textContent = "";

        feedbackArea.className =
            "feedback";
    }


    // ==========================================
    // PRIMER OBJETO
    // ==========================================

    setRandomItem();


    // ==========================================
    // ESCUCHAR PRONUNCIACIÓN
    // ==========================================

    listenBtn.addEventListener('click', () => {

        if ('speechSynthesis' in window) {

            // Detener pronunciación anterior
            window.speechSynthesis.cancel();


            const utterance =
                new SpeechSynthesisUtterance(
                    items[currentIdx].name
                );


            utterance.lang =
                'en-US';


            // Hablar despacio
            utterance.rate =
                0.8;


            window.speechSynthesis.speak(
                utterance
            );
        }

    });


    // ==========================================
    // RECONOCIMIENTO DE VOZ
    // ==========================================

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    let recognition = null;


    if (SpeechRecognition) {

        recognition =
            new SpeechRecognition();


        recognition.lang =
            'en-US';


        recognition.interimResults =
            false;


        recognition.maxAlternatives =
            1;


        // ======================================
        // BOTÓN PARA PRONUNCIAR
        // ======================================

        speakBtn.addEventListener('click', () => {

            feedbackArea.textContent =
                "";

            feedbackArea.className =
                "feedback";


            speakBtn.classList.add(
                'listening'
            );


            try {

                recognition.start();

            } catch (error) {

                console.log(
                    "El reconocimiento ya estaba activo."
                );

            }

        });


        // ======================================
        // RESULTADO DE LA PRONUNCIACIÓN
        // ======================================

        recognition.onresult =
            (event) => {

                speakBtn.classList.remove(
                    'listening'
                );


                const spokenWord =
                    event.results[0][0]
                        .transcript
                        .toLowerCase()
                        .trim();


                const targetWord =
                    items[currentIdx].name;


                // Comprobar pronunciación
                if (
                    spokenWord.includes(
                        targetWord
                    )
                ) {

                    feedbackArea.textContent =
                        "✔";


                    feedbackArea.className =
                        "feedback correct";


                    // Pasar automáticamente
                    // después de 1.2 segundos
                    setTimeout(() => {

                        feedbackArea.textContent =
                            "";

                        setRandomItem();

                    }, 1200);


                } else {

                    feedbackArea.textContent =
                        "✖";


                    feedbackArea.className =
                        "feedback incorrect";

                }

            };


        // ======================================
        // TERMINÓ DE HABLAR
        // ======================================

        recognition.onspeechend = () => {

            speakBtn.classList.remove(
                'listening'
            );

        };


        // ======================================
        // ERROR
        // ======================================

        recognition.onerror = () => {

            speakBtn.classList.remove(
                'listening'
            );


            feedbackArea.textContent =
                "✖";


            feedbackArea.className =
                "feedback incorrect";

        };

    }


    // ==========================================
    // BOTÓN SIGUIENTE
    // ==========================================

    nextBtn.addEventListener('click', () => {

        // Detener el reconocimiento de voz
        if (recognition) {

            try {

                recognition.abort();

            } catch (error) {

                console.log(
                    "Reconocimiento detenido."
                );

            }

        }


        // Quitar animación del botón
        speakBtn.classList.remove(
            'listening'
        );


        // Detener la pronunciación automática
        if ('speechSynthesis' in window) {

            window.speechSynthesis.cancel();

        }


        // Mostrar otro objeto
        setRandomItem();

    });

</script>

</body>
</html>
