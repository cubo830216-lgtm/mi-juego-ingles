<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprende los Verbos en Inglés</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        /* Tarjeta visual de la acción */
        .verb-box {
            width: 100%;
            height: 180px;
            background-color: #eef2f5;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
        }

        .word-label {
            font-size: 32px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .translation-label {
            font-size: 18px;
            color: #7f8c8d;
            margin-bottom: 25px;
            font-style: italic;
        }

        .buttons-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .action-btn {
            background-color: #f0f0f0;
            border: 2px solid #e0e0e0;
            border-radius: 50%;
            width: 70px;
            height: 70px;
            font-size: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn:hover {
            transform: scale(1.08);
            background-color: #e8e8e8;
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .feedback {
            font-size: 60px;
            height: 70px;
            line-height: 70px;
            margin-top: 10px;
        }

        .correct { color: #4caf50; }
        .incorrect { color: #f44336; }

        .listening {
            animation: pulse 1.2s infinite;
            border-color: #3498db !important;
            background-color: #ebf5fb !important;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="verb-box" id="verbBox">🏃</div>
    <div class="word-label" id="wordLabel">RUN</div>
    <div class="translation-label" id="translationLabel">(Correr)</div>

    <div class="buttons-container">
        <button class="action-btn" id="listenBtn" title="Escuchar la palabra">🔊</button>
        <button class="action-btn" id="speakBtn" title="Pronunciar la palabra">🎧</button>
       
    </div>

    <div class="feedback" id="feedbackArea"></div>
</div>

<script>
    // Arreglo de verbos con emojis y traducción
    const verbs = [
        { name: "run", translation: "Correr", emoji: "🏃" },
        { name: "jump", translation: "Saltar", emoji: "🦘" },
        { name: "eat", translation: "Comer", emoji: "🍕" },
        { name: "drink", translation: "Beber", emoji: "🥤" },
        { name: "sleep", translation: "Dormir", emoji: "😴" },
        { name: "read", translation: "Leer", emoji: "📚" },
        { name: "write", translation: "Escribir", emoji: "✍️" },
        { name: "dance", translation: "Bailar", emoji: "💃" },
        { name: "sing", translation: "Cantar", emoji: "🎤" },
        { name: "walk", translation: "Caminar", emoji: "🚶" }
    ];

    let currentIdx = -1;
    const verbBox = document.getElementById('verbBox');
    const wordLabel = document.getElementById('wordLabel');
    const translationLabel = document.getElementById('translationLabel');
    const listenBtn = document.getElementById('listenBtn');
    const speakBtn = document.getElementById('speakBtn');
    const feedbackArea = document.getElementById('feedbackArea');
    const nextBtn = document.getElementById('nextBtn');

    // Cambia a un verbo aleatorio sin repetir el anterior
    function setRandomVerb() {
        let newIdx;
        do {
            newIdx = Math.floor(Math.random() * verbs.length);
        } while (newIdx === currentIdx && verbs.length > 1);

        currentIdx = newIdx;
        const currentVerb = verbs[currentIdx];

        verbBox.textContent = currentVerb.emoji;
        wordLabel.textContent = currentVerb.name;
        translationLabel.textContent = `(${currentVerb.translation})`;
    }

    // Inicializar primer verbo
    setRandomVerb();

    // Reproducción de voz (Texto a voz)
    listenBtn.addEventListener('click', () => {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(verbs[currentIdx].name);
            utterance.lang = 'en-US';
            utterance.rate = 0.8;
            window.speechSynthesis.speak(utterance);
        }
    });

    // Reconocimiento de voz
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        speakBtn.addEventListener('click', () => {
            feedbackArea.textContent = "";
            feedbackArea.className = "feedback";
            speakBtn.classList.add('listening');
            recognition.start();
        });

        recognition.onresult = (event) => {
            speakBtn.classList.remove('listening');
            const spokenWord = event.results[0][0].transcript.toLowerCase().trim();
            const targetWord = verbs[currentIdx].name;

            if (spokenWord.includes(targetWord)) {
                feedbackArea.textContent = "✔";
                feedbackArea.className = "feedback correct";
                
                // Cambiar de verbo tras 1.2 segundos
                setTimeout(() => {
                    feedbackArea.textContent = "";
                    setRandomVerb();
                }, 1200);
            } else {
                feedbackArea.textContent = "✖";
                feedbackArea.className = "feedback incorrect";
            }
        };

        recognition.onspeechend = () => speakBtn.classList.remove('listening');
        recognition.onerror = () => {
            speakBtn.classList.remove('listening');
            feedbackArea.textContent = "✖";
            feedbackArea.className = "feedback incorrect";
        };
    }


</script>

</body>
</html>
